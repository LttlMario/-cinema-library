<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vezi împreună — Cinema Library</title><link rel="icon" href="./assets/icons/cinema-library-favicon.png"><style>body{margin:0;background:#0a0a0d;color:#f4f4f7;font:16px system-ui;line-height:1.7}main{max-width:700px;margin:4rem auto;padding:0 1.5rem}a{color:#ff3340}h1{color:#ff3340}.box{background:#18181f;padding:1.2rem;border-radius:10px}input,button{padding:.7rem;border-radius:6px;border:1px solid #333;background:#111;color:#fff;margin:.3rem 0}button{background:#e50914;border:0;cursor:pointer}.hint{color:#aaa}</style></head><body><main><a href="./">← Cinema Library</a><h1>Vezi împreună</h1><div class="box"><p>Creează un link de vizionare pentru un film sau episod. Prietenii pot deschide aceeași pagină și selecta aceeași sursă.</p><label>ID TMDB<br><input id="id" placeholder="ex. 1288069"></label><label>Tip<br><select id="type"><option value="movie">Film</option><option value="tv">Serial</option></select></label><button id="go">Creează linkul</button><p id="out"></p></div><p class="hint">Sincronizarea automată între persoane necesită un serviciu realtime; această pagină pregătește și distribuie linkul comun fără cont.</p><script>go.onclick=()=>{const id=document.querySelector('#id').value.trim();if(!id)return;const type=document.querySelector('#type').value;const url=new URL('stream/',location.href);url.searchParams.set('type',type);url.searchParams.set('id',id);url.searchParams.set('server','3');url.searchParams.set('sub','ro');out.innerHTML=`Link: <a href="${url}">${url}</a>`}</script></main></body></html>
