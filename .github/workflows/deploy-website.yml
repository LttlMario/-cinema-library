name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject TMDB token
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          test -n "$TMDB_TOKEN" || (echo "TMDB_TOKEN secret is missing" && exit 1)
          for page in index.html stream/index.html catalog.html genres.html; do
            perl -0pi -e 's/\Q__TMDB_TOKEN__\E/$ENV{TMDB_TOKEN}/g; s/\$\{TMDB_TOKEN\}/$ENV{TMDB_TOKEN}/g' "$page"
          done
          for page in about.html catalog.html contact.html contribute.html download.html genres.html privacy.html sitemap.html terms.html watch-together.html 404.html; do sed -i 's#</head>#<link rel="stylesheet" href="assets/site-shell.css"><script defer src="assets/site-shell.js?v=20261020-shell2"></script></head>#' "$page"; done

      - name: Prepare Pages artifact
        run: mkdir -p public && mv index.html 404.html contribute.html download.html catalog.html genres.html about.html contact.html terms.html privacy.html sitemap.html watch-together.html manifest.webmanifest sw.js assets stream tflix public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
