name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject TMDB token
        run: |
          test -n "${{ secrets.TMDB_TOKEN }}" || (echo "TMDB_TOKEN secret is missing" && exit 1)
          sed -i "s|__TMDB_TOKEN__|${{ secrets.TMDB_TOKEN }}|g" index.html
          sed -i "s|__TMDB_TOKEN__|${{ secrets.TMDB_TOKEN }}|g" stream/index.html
          sed -i "s|__TMDB_TOKEN__|${{ secrets.TMDB_TOKEN }}|g" catalog.html
          sed -i "s|__TMDB_TOKEN__|${{ secrets.TMDB_TOKEN }}|g" genres.html

      - name: Prepare Pages artifact
          run: mkdir -p public && mv index.html 404.html contribute.html catalog.html genres.html about.html contact.html terms.html privacy.html sitemap.html watch-together.html manifest.webmanifest sw.js assets stream public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
