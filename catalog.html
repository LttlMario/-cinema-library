<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog — Cinema Library</title><link rel="icon" href="./assets/icons/cinema-library-favicon.png"><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0d;color:#f4f4f7;font:15px 'Hanken Grotesk',system-ui}header{height:70px;display:flex;align-items:center;gap:2rem;padding:0 clamp(1rem,4vw,3.75rem);border-bottom:1px solid #29242a;background:rgba(9,9,12,.92);position:sticky;top:0;z-index:3}.logo{font-size:1.55rem;font-weight:800;color:#e50914;white-space:nowrap}.nav{display:flex;gap:1.4rem;align-items:center}.nav a{color:#aaa;text-decoration:none;font-weight:600}.nav a:hover{color:#fff}.search{margin-left:auto;padding:.65rem 1rem;width:min(330px,32vw);border:1px solid #36313a;border-radius:99px;background:#16151a;color:#fff}.wrap{max-width:1500px;margin:auto;padding:2rem clamp(1rem,4vw,3.75rem)}.eyebrow{color:#ff3340;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:1.4rem}.head h1{font-size:clamp(1.8rem,4vw,3rem);margin:.4rem 0}.head p{color:#999;margin:0}.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.4rem}.filters select{padding:.65rem .8rem;border:1px solid #36313a;border-radius:8px;background:#16151a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}.card{position:relative;background:#18181f;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 35px #000}.card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}.card p{padding:.75rem;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{position:absolute;top:7px;left:7px;padding:.2rem .45rem;border-radius:4px;background:#e50914;font-size:.62rem;font-weight:800}.more{display:block;margin:2rem auto;padding:.7rem 1.2rem;border:1px solid #e50914;border-radius:8px;background:#e50914;color:#fff;cursor:pointer}.status{text-align:center;color:#999;min-height:1.5rem}@media(max-width:800px){.nav{display:none}.search{width:42px;margin-left:auto}.head{display:block}}</style></head><body><header><a class="logo" href="./">Cinema Library</a><nav class="nav"><a href="./">Acasă</a><a href="./catalog.html?type=movie">Filme</a><a href="./catalog.html?type=tv">Seriale</a><a href="./watch-together.html">Vezi împreună</a><a href="./catalog.html?mode=top">Top IMDb</a></nav><input class="search" id="search" placeholder="Caută în catalog…"></header><main class="wrap"><div class="head"><div><div class="eyebrow">Cinema Library</div><h1 id="title">Catalog</h1><p id="subtitle">Titluri selectate pentru tine</p></div></div><div class="filters"><select id="country"><option value="">Toate țările</option><option value="US">Statele Unite</option><option value="GB">Marea Britanie</option><option value="FR">Franța</option><option value="DE">Germania</option><option value="JP">Japonia</option><option value="KR">Coreea de Sud</option><option value="RO">România</option></select><select id="sort"><option value="popularity.desc">Populare</option><option value="primary_release_date.desc">Cele mai noi</option><option value="vote_average.desc">Cele mai apreciate</option></select></div><p class="status" id="status">Se încarcă…</p><section class="grid" id="grid"></section><button class="more" id="more">Vezi mai multe</button></main><script>const token='__TMDB_TOKEN__',q=new URLSearchParams(location.search),mode=q.get('mode'),type=q.get('type')==='tv'?'tv':'movie',genre=q.get('genre')||'',initialCountry=q.get('country')||'',names={28:'Acțiune',27:'Horror',878:'SF',53:'Thriller'};let page=1,items=[];const $=id=>document.getElementById(id);$('country').value=initialCountry;$('title').textContent=mode==='top'?`Top IMDb — ${type==='tv'?'Seriale':'Filme'}`:`${type==='tv'?'Seriale':'Filme'}${names[genre]?' — '+names[genre]:''}`;function endpoint(){const country=$('country').value,sort=mode==='top'?'vote_average.desc':$('sort').value;return `/discover/${type}?sort_by=${sort}&include_adult=false${mode==='top'?'&vote_count.gte=500':''}${genre?'&with_genres='+genre:''}${country?'&with_origin_country='+country:''}`}function load(){ $('status').textContent='Se încarcă…';fetch('https://api.themoviedb.org/3'+endpoint()+'&page='+page+'&language=ro-RO',{headers:{Authorization:'Bearer '+token,accept:'application/json'}}).then(r=>r.json()).then(d=>{const next=(d.results||[]).filter(x=>x.poster_path);items=[...items,...next];$('status').textContent=`${items.length} titluri afișate`;$('grid').innerHTML=items.map(x=>`<article class="card" onclick="location.href='stream/?type=${type}&id=${x.id}&server=3&sub=ro'"><span class="badge">${type==='tv'?'SERIAL':'FILM'}</span><img loading="lazy" decoding="async" src="https://image.tmdb.org/t/p/w342${x.poster_path}" alt="${(x.title||x.name||'').replace(/"/g,'&quot;')}"><p>${x.title||x.name||'Fără titlu'}</p></article>`).join('');$('more').style.display=d.total_pages&&page<Math.min(d.total_pages,20)?'block':'none'}).catch(()=>{$('status').textContent='Catalogul nu este disponibil momentan.'})}$('country').onchange=()=>{page=1;items=[];load()};$('sort').onchange=()=>{page=1;items=[];load()};$('more').onclick=()=>{page++;load()};$('search').oninput=e=>{const s=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(s)?'':'none')};load();</script></body></html>
