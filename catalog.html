<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog — Cinema Library</title><link rel="icon" href="./assets/icons/cinema-library-favicon.png"><style>body{margin:0;background:#0a0a0d;color:#f4f4f7;font:16px system-ui;padding:2rem}a{color:#ff3340}.wrap{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}.card{background:#18181f;border-radius:8px;overflow:hidden;cursor:pointer}.card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}.card p{padding:.7rem;margin:0}.back{display:inline-block;margin-bottom:2rem}.empty{text-align:center;padding:4rem;color:#aaa}</style></head><body><main class="wrap"><a class="back" href="./">← Cinema Library</a><h1 id="title">Catalog</h1><p id="status">Se încarcă…</p><section class="grid" id="grid"></section></main><script>const token='__TMDB_TOKEN__',q=new URLSearchParams(location.search),type=q.get('type')==='tv'?'tv':'movie',genre=q.get('genre'),mode=q.get('mode');const names={28:'Acțiune',27:'Horror',878:'SF',53:'Thriller'};document.title=mode==='top'?'Top IMDB — Cinema Library':`${names[genre]||'Filme'} — Cinema Library`;document.querySelector('#title').textContent=mode==='top'?'Top IMDB':`${type==='movie'?'Filme':'Seriale'}${names[genre]?' — '+names[genre]:''}`;const endpoint=mode==='top'?`/discover/movie?sort_by=vote_average.desc&vote_count.gte=500&with_original_language=en`:`/discover/${type}?sort_by=popularity.desc${genre?'&with_genres='+genre:''}`;fetch('https://api.themoviedb.org/3'+endpoint+'&language=ro-RO',{headers:{Authorization:'Bearer '+token,accept:'application/json'}}).then(r=>r.json()).then(d=>{const items=d.results||[];document.querySelector('#status').textContent=`${items.length} titluri`;document.querySelector('#grid').innerHTML=items.map(x=>`<article class="card" onclick="location.href='stream/?type=${type}&id=${x.id}&server=3&sub=ro'"><img loading="lazy" src="https://image.tmdb.org/t/p/w342${x.poster_path}" alt="${(x.title||x.name||'').replace(/"/g,'&quot;')}"><p>${x.title||x.name||'Fără titlu'}</p></article>`).join('')}).catch(()=>document.querySelector('#status').textContent='Catalogul nu este disponibil momentan.');</script></body></html>
