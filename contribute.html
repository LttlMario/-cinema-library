<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0d">
  <title>Contribuie — Cinema Library</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0d; --panel:#15151b; --line:rgba(255,255,255,.12); --text:#f7f7f8; --muted:#a5a5af; --accent:#e50914; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top, #211019, var(--bg) 55%); color:var(--text); font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(620px,100%); padding:clamp(26px,6vw,54px); background:rgba(21,21,27,.92); border:1px solid var(--line); border-radius:24px; box-shadow:0 24px 80px rgba(0,0,0,.35); text-align:center; }
    .brand { color:var(--accent); font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:.35rem 0 .8rem; font-size:clamp(2rem,6vw,3.5rem); line-height:1; }
    p { color:var(--muted); margin:0 auto 1.5rem; max-width:46ch; }
    .actions { display:grid; gap:.8rem; margin-top:1.8rem; }
    a { display:inline-flex; justify-content:center; align-items:center; min-height:48px; padding:.75rem 1.1rem; border-radius:12px; color:var(--text); text-decoration:none; font-weight:800; border:1px solid var(--line); background:rgba(255,255,255,.05); }
    a.primary { background:var(--accent); border-color:var(--accent); box-shadow:0 10px 30px rgba(229,9,20,.25); }
    a:hover { filter:brightness(1.12); }
    small { display:block; margin-top:1.5rem; color:var(--muted); font-size:.8rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Cinema Library</div>
    <h1>Contribuie</h1>
    <p>Dacă îți place proiectul și vrei să ajuți la dezvoltarea lui, poți contribui prin Revolut.</p>
    <div class="actions">
      <a class="primary" href="https://revolut.me/mariomihail" target="_blank" rel="noopener noreferrer">Contribuie prin Revolut</a>
      <a href="./">← Înapoi la Cinema Library</a>
    </div>
    <small>Orice contribuție este apreciată. Mulțumesc!</small>
  </main>
<script src="assets/site-shell.js"></script>
</body>
</html>
